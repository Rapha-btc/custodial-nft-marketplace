# Rendezvous (rv) fuzzing project for fakfun-collection-bids: an isolated copy
# of the contract + its harness, generated by scripts/rv-sync.sh. Never edit
# rendezvous/contracts/*.clar by hand.
[project]
name = "collection-bids-rendezvous"
description = "Fuzzing harness for fakfun-collection-bids"
authors = []
telemetry = false
cache_dir = "./.cache"

requirements = [
  { contract_id = 'SP2PABAF9FTAJYNFZH93XENAJ8FVY99RRM50D2JG9.nft-trait' },
  { contract_id = 'SP3FBR2AGK5H9QBDH3EEN6DF8EK8JY7RX8QJ5SVTE.sip-010-trait-ft-standard' },
  { contract_id = 'SM3VDXK3WZZSA84XXFKAFAF15NNZX32CTSG82JFQ4.sbtc-token' },
]

[contracts.rv-ft]
path = "contracts/rv-ft.clar"
clarity_version = 4
epoch = 3.3

[contracts.rv-nft]
path = "contracts/rv-nft.clar"
clarity_version = 4
epoch = 3.3

[contracts.fakfun-collection-bids]
path = "contracts/fakfun-collection-bids.clar"
clarity_version = 4
epoch = 3.3
depends_on = ["rv-nft", "rv-ft"]
